<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo_favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>VibeGene — DNA Editing, Cloning &amp; Sequence Analysis</title>
    <meta name="description" content="Free DNA sequence editor with a familiar interface. Map plasmids, simulate cloning, design primers and align Sanger traces in your browser or on desktop." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VibeGene — Free Molecular Biology Software" />
    <meta property="og:description" content="Map plasmids, simulate cloning, design primers and align Sanger traces in a familiar interface. Free in your browser and on desktop." />
    <meta property="og:url" content="https://vibe-gene.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="VibeGene — Free Molecular Biology Software" />
    <meta name="twitter:description" content="Map plasmids, simulate cloning, design primers and align Sanger traces in a familiar interface. Free in your browser and on desktop." />
    <script>
      // Hide boot splash before paint for hybrid popups and secondary windows.
      // Startup (normal dock launch) keeps the splash; Open With uses bootSplash=0.
      try {
        var search = location.search
        var vgWindowMatch = /[?&]vgWindow=([^&]*)/.exec(search)
        var vgWindow = vgWindowMatch ? decodeURIComponent(vgWindowMatch[1]) : ''
        if (vgWindow && vgWindow !== 'startup') {
          document.documentElement.classList.add('vg-hybrid-window')
        }
        if (/[?&]bootSplash=0(?:&|$)/.test(search)) {
          document.documentElement.classList.add('vg-no-splash')
        }
        if (window.__TAURI_INTERNALS__ || window.__TAURI__) {
          document.documentElement.classList.add('vg-tauri')
          if (/Windows/i.test(navigator.userAgent)) {
            document.documentElement.classList.add('vg-windows-tauri')
          }
        }
      } catch (e) {}
    </script>
    <link rel="preload" as="image" href="/vibegene-logo-splash-bright.png" />
    <link rel="preload" as="image" href="/vibegene-logo-splash-dark.png" />
    <link rel="preload" as="image" href="/snapgene-icon.png" />
    <link rel="preload" as="image" href="/beta-badge.png" />
    <style>
      html.vg-hybrid-window #boot-splash,
      html.vg-no-splash #boot-splash {
        display: none !important;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        box-sizing: border-box;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(1.25rem, 3.5vh, 2.25rem);
        padding: 2rem 1.25rem;
        text-align: center;
        font-family: system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #1a2b44;
        background: #ffffff;
        user-select: none;
        transition: opacity 280ms ease;
      }

      #boot-splash.is-leaving {
        opacity: 0;
        pointer-events: none;
      }

      #boot-splash .meme {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.4em 0.55em;
        margin: 0;
        font-size: clamp(1.2rem, 3.4vw, 1.75rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.2;
        color: #1a2b44;
      }

      #boot-splash .meme-icon {
        display: inline-block;
        height: 2.15em;
        width: auto;
        vertical-align: -0.55em;
      }

      #boot-splash .logo-wrap {
        position: relative;
        display: inline-block;
        max-width: min(34rem, 88vw);
        line-height: 0;
      }

      #boot-splash .logo {
        display: block;
        width: auto;
        height: auto;
        max-width: min(34rem, 88vw);
        max-height: 42svh;
        object-fit: contain;
      }

      #boot-splash .logo-dark {
        display: none;
      }

      :root[data-color-scheme='dark'] #boot-splash .logo-bright {
        display: none;
      }

      :root[data-color-scheme='dark'] #boot-splash .logo-dark {
        display: block;
      }

      #boot-splash .beta {
        position: absolute;
        top: 14%;
        /* ~one badge-width further right from the previous 2% inset */
        right: calc(2% - clamp(1.15rem, 3.4vw, 1.85rem));
        display: block;
        width: clamp(1.15rem, 3.4vw, 1.85rem);
        height: auto;
        transform: rotate(-20deg);
        transform-origin: center;
        pointer-events: none;
        user-select: none;
      }

      #boot-splash .loading {
        margin: 0;
        font-size: clamp(2.6rem, 9vw, 4.75rem);
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 1;
        color: #1a2b44;
        animation: boot-pulse 1.35s ease-in-out infinite;
      }

      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash {
          transition: none;
        }

        #boot-splash .loading {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="boot-splash"
      role="status"
      aria-live="polite"
      aria-label="Loading VibeGene"
    >
      <p class="meme">
        <span>We have</span>
        <img class="meme-icon" src="/snapgene-icon.png" alt="SnapGene" width="36" height="57" />
        <span>at home</span>
      </p>
      <div class="logo-wrap">
        <img
          class="logo logo-bright"
          src="/vibegene-logo-splash-bright.png"
          alt="VibeGene — vibecoded, free, SnapGene alternative"
          width="1692"
          height="352"
        />
        <img
          class="logo logo-dark"
          src="/vibegene-logo-splash-dark.png"
          alt=""
          aria-hidden="true"
          width="1692"
          height="352"
        />
        <img class="beta" src="/beta-badge.png" alt="β" width="193" height="369" />
      </div>
      <p class="loading">Loading</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
