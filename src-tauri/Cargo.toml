[package]
name = "vibegene"
version = "1.7.3"
description = "VibeGene — local-first plasmid and sequence workbench"
authors = ["VibeGene"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vibegene_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-updater = "2.14.1"
tauri-plugin-clipboard-manager = "2.3.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
